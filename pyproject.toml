[project]
name = "options-trading-screener"
version = "0.1.0"
description = "FastMCP options call screener using free market-data sources."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastmcp>=2.10",
  "yfinance>=0.2.50",
  "pandas>=2.2",
  "numpy>=1.26,<2",
  "py_vollib>=1.0.3",
  "scipy>=1.12",
  "requests>=2.32",
  "tenacity>=8.5",
  "diskcache>=5.6",
  "python-dotenv>=1.0",
  "polygon-api-client>=1.14",
]

[project.scripts]
options-screener = "screener_mcp:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]
py-modules = ["screener_mcp"]
